<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Office</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/office-192.png">
<meta name="theme-color" content="#f2f2f5">
<style>
  :root {
    --bg: #f2f2f5; --ink: #1d1d1f; --ink-2: #86868b; --hover: rgba(0,0,0,.05); --blue: #0a72e8;
    font-family: 'Segoe UI Variable Text', 'Segoe UI Variable', -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1d; --ink: #f5f5f7; --ink-2: #8e8e93; --hover: rgba(255,255,255,.07); --blue: #3b93ff; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); display: grid; place-items: center; -webkit-font-smoothing: antialiased; user-select: none; overflow: hidden; }
  main { display: flex; gap: 6px; animation: in .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes in { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
  a.app { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 14px 16px 10px; border-radius: 16px; text-decoration: none; color: var(--ink); font-size: 12.5px; font-weight: 500; transition: background .15s, transform .12s; }
  a.app:hover { background: var(--hover); }
  a.app:active { transform: scale(.95); }
  a.app:focus-visible { outline: 2px solid var(--blue); outline-offset: 0; }
  .icon { width: 64px; height: 64px; border-radius: 15px; display: grid; place-items: center; color: #fff; font: 600 30px 'Segoe UI Variable Display', 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 65%, #fff), var(--c)); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 6px 16px color-mix(in srgb, var(--c) 30%, transparent), inset 0 0 0 .5px rgba(255,255,255,.25); transition: transform .25s cubic-bezier(.34,1.4,.64,1); }
  a.app:hover .icon { transform: translateY(-2px) scale(1.04); }
  footer { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 11px; color: var(--ink-2); }
  footer button { font: inherit; color: var(--blue); background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: 5px; }
  footer button:hover { background: var(--hover); }
  #updmsg button { margin-left: 4px; }
</style>
</head>
<body>
<main>
  <a class="app" href="write/index.html" title="Documents (.docx)"><div class="icon" style="--c:#2b579a">W</div>Write</a>
  <a class="app" href="cells/index.html" title="Spreadsheets (.xlsx, .csv)"><div class="icon" style="--c:#217346">X</div>Cells</a>
  <a class="app" href="slides/index.html" title="Presentations (.pptx)"><div class="icon" style="--c:#b7472a">P</div>Slides</a>
</main>
<footer><span id="ver">Lumen Office</span> · <button id="upd" type="button">Check for updates</button> <span id="updmsg"></span></footer>
<script>
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  fetch('version.json', { cache: 'no-store' }).then(r => r.json()).then(v => { document.getElementById('ver').textContent = 'Lumen Office ' + v.version; }).catch(() => {});
  document.getElementById('upd').onclick = async () => {
    const msg = document.getElementById('updmsg');
    msg.textContent = 'Checking…';
    try {
      const r = await fetch('_update/status?refresh=1', { cache: 'no-store' });
      if (!r.ok || !(r.headers.get('Content-Type') || '').includes('json')) throw new Error('Updates work in the installed Lumen Office.');
      const s = await r.json();
      if (s.error) throw new Error(s.error);
      if (!s.available) { msg.textContent = 'Up to date.'; return; }
      msg.textContent = s.latest + ' is available.';
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Install';
      b.onclick = async () => {
        msg.textContent = 'Installing ' + s.latest + '…';
        const a = await fetch('_update/apply', { method: 'POST', headers: { 'X-Lumen': '1' } });
        const j = await a.json();
        if (!a.ok) { msg.textContent = 'Update failed: ' + (j.error || a.status); return; }
        msg.textContent = 'Updated to ' + j.version + '. Reopen Lumen to finish.';
        setTimeout(() => location.reload(), 2500);
      };
      msg.appendChild(b);
    } catch (e) { msg.textContent = e.message || String(e); }
  };
  if (location.hash === '#updates') document.getElementById('upd').click();
</script>
</body>
</html>
